name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/ipcheckapi-linux-${ARCH}" .
          done
          (cd dist && sha256sum ipcheckapi-linux-* > SHA256SUMS)

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; no overwrite performed."
            exit 0
          fi
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "ipcheckapi $VERSION"
